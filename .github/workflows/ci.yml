# Every push and pull request: lint, unit tests, the generation snapshot and
# the production build (the same checks as before a commit, docs/ and CLAUDE.md).
name: CI

on:
  push:
    branches: [main, stabilization/clinical-layout]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: node verify-generations.mjs
      - run: npm run build

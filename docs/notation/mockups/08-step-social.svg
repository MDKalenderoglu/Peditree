<svg xmlns="http://www.w3.org/2000/svg" width="840" height="210" viewBox="0 0 840 210" font-family="system-ui, sans-serif">
<rect width="840" height="210" fill="#fff"/>
<text x="12" y="20" font-size="13" font-weight="700" fill="#1e293b">Üvey ve sosyal ebeveynlik</text>
<text x="828" y="20" font-size="11" fill="#b91c1c" text-anchor="end">taslak — klinik onay bekliyor, üretimde değil</text>
<line x1="80" y1="60" x2="200" y2="60" stroke="#64748b" stroke-width="1.5"/><line x1="140" y1="60" x2="140" y2="100" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="120" y="100" width="40" height="40" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="140" y="170" font-size="11" fill="#1e293b" text-anchor="middle">A — mevcut: yalnız sosyal bağı olan</text><text x="140" y="184" font-size="11" fill="#1e293b" text-anchor="middle">her çocuk (evlat edinme, koruyucu aile,</text><text x="140" y="198" font-size="11" fill="#1e293b" text-anchor="middle">üvey, vasi) kesikli çizgiyle</text><line x1="350" y1="60" x2="410" y2="60" stroke="#64748b" stroke-width="1.5"/><line x1="380" y1="60" x2="380" y2="100" stroke="#64748b" stroke-width="1.5"/><rect x="360" y="100" width="40" height="40" fill="#fff" stroke="#1e293b" stroke-width="2"/><line x1="430" y1="60" x2="490" y2="60" stroke="#64748b" stroke-width="1.5"/><text x="380" y="152" font-size="10" fill="#475569" text-anchor="middle">üvey baba: ilişki çizgisi</text><text x="420" y="180" font-size="11" fill="#475569" text-anchor="middle">B — üvey ilişki yalnız partnerlik</text><text x="420" y="194" font-size="11" fill="#475569" text-anchor="middle">çizgisiyle; ebeveyn çizgisi çizilmez</text><line x1="640" y1="60" x2="760" y2="60" stroke="#64748b" stroke-width="1.5"/><line x1="700" y1="60" x2="700" y2="100" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="680" y="100" width="40" height="40" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="726" y="124" font-size="10" fill="#475569">koruyucu</text><text x="700" y="170" font-size="11" fill="#b91c1c" text-anchor="middle">C — kesikli çizgi + tür etiketi</text><text x="700" y="184" font-size="11" fill="#b91c1c" text-anchor="middle">(NSGC'de ayrı sembol yok)</text>
</svg>

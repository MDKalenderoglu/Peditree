<svg xmlns="http://www.w3.org/2000/svg" width="820" height="230" viewBox="0 0 820 230" font-family="system-ui, sans-serif">
<rect width="820" height="230" fill="#fff"/>
<text x="12" y="20" font-size="13" font-weight="700" fill="#1e293b">Evlat edinme gösterimi</text>
<text x="808" y="20" font-size="11" fill="#b91c1c" text-anchor="end">taslak — klinik onay bekliyor, üretimde değil</text>
<line x1="70" y1="60" x2="150" y2="60" stroke="#64748b" stroke-width="1.5"/><line x1="110" y1="60" x2="110" y2="90" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="90" y="90" width="40" height="40" fill="#1e293b" stroke="#1e293b" stroke-width="2"/><text x="110" y="82" font-size="10" fill="#64748b" text-anchor="middle">III-3</text><text x="110" y="170" font-size="11" fill="#1e293b" text-anchor="middle">A — mevcut (CB-07)</text><text x="110" y="184" font-size="11" fill="#1e293b" text-anchor="middle">kesikli iniş var,</text><text x="110" y="198" font-size="11" fill="#1e293b" text-anchor="middle">köşeli parantez yok</text><line x1="270" y1="60" x2="350" y2="60" stroke="#64748b" stroke-width="1.5"/><line x1="310" y1="60" x2="310" y2="83" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="290" y="90" width="40" height="40" fill="#1e293b" stroke="#1e293b" stroke-width="2"/><path d="M289,83 L283,83 L283,137 L289,137" fill="none" stroke="#1e293b" stroke-width="2"/><path d="M331,83 L337,83 L337,137 L331,137" fill="none" stroke="#1e293b" stroke-width="2"/><text x="280" y="78" font-size="10" fill="#64748b" text-anchor="end">III-3</text><text x="310" y="170" font-size="11" fill="#475569" text-anchor="middle">B — evlat edinilmiş (içeri):</text><text x="310" y="184" font-size="11" fill="#475569" text-anchor="middle">köşeli parantez + kesikli çizgi</text><text x="310" y="198" font-size="11" fill="#475569" text-anchor="middle">evlat edinen ebeveynlerden</text><line x1="470" y1="60" x2="550" y2="60" stroke="#64748b" stroke-width="1.5"/><line x1="510" y1="60" x2="510" y2="83" stroke="#64748b" stroke-width="1.5"/><rect x="490" y="90" width="40" height="40" fill="#fff" stroke="#1e293b" stroke-width="2"/><path d="M489,83 L483,83 L483,137 L489,137" fill="none" stroke="#1e293b" stroke-width="2"/><path d="M531,83 L537,83 L537,137 L531,137" fill="none" stroke="#1e293b" stroke-width="2"/><text x="480" y="78" font-size="10" fill="#64748b" text-anchor="end">II-2</text><text x="510" y="170" font-size="11" fill="#475569" text-anchor="middle">C — evlat verilmiş (dışarı):</text><text x="510" y="184" font-size="11" fill="#475569" text-anchor="middle">köşeli parantez + düz çizgi</text><text x="510" y="198" font-size="11" fill="#475569" text-anchor="middle">biyolojik ebeveynlerden</text><line x1="640" y1="50" x2="700" y2="50" stroke="#64748b" stroke-width="1.5"/><line x1="670" y1="50" x2="670" y2="70" stroke="#64748b" stroke-width="1.5"/><line x1="670" y1="70" x2="702" y2="70" stroke="#64748b" stroke-width="1.5"/><line x1="702" y1="70" x2="702" y2="83" stroke="#64748b" stroke-width="1.5"/><line x1="720" y1="40" x2="780" y2="40" stroke="#64748b" stroke-width="1.5"/><line x1="750" y1="40" x2="750" y2="64" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="750" y1="64" x2="718" y2="64" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="718" y1="64" x2="718" y2="83" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="690" y="90" width="40" height="40" fill="#fff" stroke="#1e293b" stroke-width="2"/><path d="M689,83 L683,83 L683,137 L689,137" fill="none" stroke="#1e293b" stroke-width="2"/><path d="M731,83 L737,83 L737,137 L731,137" fill="none" stroke="#1e293b" stroke-width="2"/><text x="710" y="170" font-size="11" fill="#b91c1c" text-anchor="middle">D — biyolojik ve evlat edinen aile</text><text x="710" y="184" font-size="11" fill="#b91c1c" text-anchor="middle">birlikte: iki ebeveyn çiftine bağlı</text><text x="710" y="198" font-size="11" fill="#b91c1c" text-anchor="middle">(model değişikliği gerektirir)</text>
</svg>

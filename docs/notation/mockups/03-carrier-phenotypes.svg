<svg xmlns="http://www.w3.org/2000/svg" width="840" height="210" viewBox="0 0 840 210" font-family="system-ui, sans-serif">
<rect width="840" height="210" fill="#fff"/>
<text x="12" y="20" font-size="13" font-weight="700" fill="#1e293b">Taşıyıcılık ve çoklu fenotip</text>
<text x="828" y="20" font-size="11" fill="#b91c1c" text-anchor="end">taslak — klinik onay bekliyor, üretimde değil</text>
<defs><pattern id="h" width="1" height="1" patternContentUnits="objectBoundingBox"><rect width="0.5" height="1" fill="#1e293b"/><rect x="0.5" width="0.5" height="1" fill="#fff"/></pattern><pattern id="q" width="1" height="1" patternContentUnits="objectBoundingBox"><rect width="0.5" height="0.5" fill="#1e293b"/><rect x="0.5" y="0.5" width="0.5" height="0.5" fill="#94a3b8"/></pattern></defs><circle cx="100" cy="90" r="20" fill="url(#h)" stroke="#1e293b" stroke-width="2"/><text x="100" y="140" font-size="11" fill="#1e293b" text-anchor="middle">A — mevcut</text><text x="100" y="154" font-size="11" fill="#1e293b" text-anchor="middle">yarım dolgu = "taşıyıcı"</text><circle cx="260" cy="90" r="20" fill="#fff" stroke="#1e293b" stroke-width="2"/><circle cx="260" cy="90" r="4" fill="#1e293b"/><text x="260" y="140" font-size="11" fill="#475569" text-anchor="middle">B — ortada nokta</text><text x="260" y="154" font-size="11" fill="#475569" text-anchor="middle">taşıyıcı (hastalık beklenmez)</text><circle cx="420" cy="90" r="20" fill="#fff" stroke="#1e293b" stroke-width="2"/><line x1="420" y1="70" x2="420" y2="110" stroke="#1e293b" stroke-width="2"/><text x="420" y="140" font-size="11" fill="#475569" text-anchor="middle">C — dikey çizgi</text><text x="420" y="154" font-size="11" fill="#475569" text-anchor="middle">asemptomatik / presemptomatik</text><circle cx="580" cy="90" r="20" fill="url(#h)" stroke="#1e293b" stroke-width="2"/><text x="580" y="140" font-size="11" fill="#b91c1c" text-anchor="middle">D — yarım dolgu</text><text x="580" y="154" font-size="11" fill="#b91c1c" text-anchor="middle">bazı özetlerde presemptomatik;</text><text x="580" y="168" font-size="11" fill="#b91c1c" text-anchor="middle">kaynaklar çelişiyor</text><rect x="720" y="70" width="40" height="40" fill="url(#q)" stroke="#1e293b" stroke-width="2"/><text x="740" y="140" font-size="11" fill="#475569" text-anchor="middle">E — bölmeli dolgu</text><text x="740" y="154" font-size="11" fill="#475569" text-anchor="middle">birden fazla fenotip</text><text x="740" y="168" font-size="11" fill="#475569" text-anchor="middle">(lejant zorunlu)</text>
</svg>

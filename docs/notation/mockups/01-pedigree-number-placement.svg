<svg xmlns="http://www.w3.org/2000/svg" width="820" height="240" viewBox="0 0 820 240" font-family="system-ui, sans-serif">
<rect width="820" height="240" fill="#fff"/>
<text x="12" y="20" font-size="13" font-weight="700" fill="#1e293b">Pedigri numarasının yeri (iniş çizgisiyle çakışma)</text>
<text x="808" y="20" font-size="11" fill="#b91c1c" text-anchor="end">taslak — klinik onay bekliyor, üretimde değil</text>
<line x1="110" y1="50" x2="110" y2="90" stroke="#64748b" stroke-width="1.5"/><rect x="90" y="90" width="40" height="40" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="110" y="82" font-size="10" fill="#64748b" text-anchor="middle">III-3</text><text x="110" y="144" font-size="11" fill="#475569" text-anchor="middle">5</text><text x="110" y="190" font-size="11" fill="#1e293b" text-anchor="middle">A — mevcut</text><text x="110" y="204" font-size="11" fill="#1e293b" text-anchor="middle">numara sembolün üstünde ortada;</text><text x="110" y="218" font-size="11" fill="#1e293b" text-anchor="middle">iniş çizgisi içinden geçiyor</text><line x1="310" y1="50" x2="310" y2="90" stroke="#64748b" stroke-width="1.5"/><rect x="290" y="90" width="40" height="40" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="287" y="86" font-size="10" fill="#64748b" text-anchor="end">III-3</text><text x="310" y="144" font-size="11" fill="#475569" text-anchor="middle">5</text><text x="310" y="190" font-size="11" fill="#475569" text-anchor="middle">B — sol üst</text><text x="310" y="204" font-size="11" fill="#475569" text-anchor="middle">numara çizginin solunda,</text><text x="310" y="218" font-size="11" fill="#475569" text-anchor="middle">sembolün sol üst köşesinde</text><line x1="510" y1="50" x2="510" y2="90" stroke="#64748b" stroke-width="1.5"/><rect x="490" y="90" width="40" height="40" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="533" y="86" font-size="10" fill="#64748b" text-anchor="start">III-3</text><text x="510" y="144" font-size="11" fill="#475569" text-anchor="middle">5</text><text x="510" y="190" font-size="11" fill="#475569" text-anchor="middle">C — sağ üst</text><text x="510" y="204" font-size="11" fill="#475569" text-anchor="middle">numara çizginin sağında,</text><text x="510" y="218" font-size="11" fill="#475569" text-anchor="middle">sembolün sağ üst köşesinde</text><line x1="710" y1="50" x2="710" y2="90" stroke="#64748b" stroke-width="1.5"/><rect x="690" y="90" width="40" height="40" fill="#fff" stroke="#1e293b" stroke-width="2"/><text x="710" y="144" font-size="10" fill="#64748b" text-anchor="middle">III-3</text><text x="710" y="158" font-size="11" fill="#475569" text-anchor="middle">5</text><text x="710" y="190" font-size="11" fill="#475569" text-anchor="middle">D — sembolün altı</text><text x="710" y="204" font-size="11" fill="#475569" text-anchor="middle">numara yaşın üstünde,</text><text x="710" y="218" font-size="11" fill="#475569" text-anchor="middle">çizgiden uzakta</text>
